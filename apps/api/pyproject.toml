[project]
name = "engineer-api"
version = "0.1.0"
description = "Self-hosted workbench API and data engine for data engineers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "sqlglot>=25.20.0",
    "sqlalchemy>=2.0.35",
    "cryptography>=43.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.0",
    "python-calamine>=0.2.0",
    "argon2-cffi>=25.1.0",
    "pymongo>=4.18.2",
    "fsspec>=2026.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP042", "W291"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
