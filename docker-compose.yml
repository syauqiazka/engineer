services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://engineer:engineer@postgres:5432/engineer_app
      - WORKSPACE_DIR=/workspace
    volumes:
      - ./apps/api:/app
      - ./workspace_data:/workspace
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=engineer
      - POSTGRES_PASSWORD=engineer
      - POSTGRES_DATABASE=engineer_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
